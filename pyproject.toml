[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuts-scheduler"
version = "0.6.0"
dependencies = [
  "redis>=5.0",
  "python-dateutil>=2.8.2",
  "PyYAML>=6.0.1",
]
authors = [
  { name="Sam Huffman", email="huffmsa@gmail.com" },
]
description = "A Redis backed job runner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["nuts-scheduler[web]", "pytest>=8", "httpx", "build", "twine"]

[project.urls]
Homepage = "https://github.com/huffmsa/nuts"
Issues = "https://github.com/huffmsa/nuts/issues"

[tool.setuptools.packages.find]
include = ["nuts", "nuts.*"]

[tool.setuptools.package-data]
"nuts.web" = ["templates/*.html"]
