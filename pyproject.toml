[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nuts-scheduler"
version = "0.6.0"
dependencies = ["python-dateutil==2.9.0.post0", "redis==5.2.1"]
authors = [
  { name="Sam Huffman", email="huffmsa@gmail.com" },
]
description = "A Redis backed job runner"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/huffmsa/nuts"
Issues = "https://github.com/huffmsa/nuts/issues"

[tool.setuptools.packages.find]
include = ["nuts", "nuts.*"]

[tool.setuptools.package-data]
"nuts.web" = ["templates/*.html"]
